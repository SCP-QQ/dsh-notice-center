  <!-- 通知中心的插件图标：官方插件页（侧栏 Plugins 面板）每张卡片/每一行用的就是它。
       宿主 (dsh-app-boot) 读 package.json 顶层 icon，校验后转成 data:URL 交给 <img> 渲染，
       所以写死颜色、不能用 currentColor 跟随主题（与 lib/client.cjs 里那颗侧栏导航铃铛不同）。
       铃身 #3399FF 是品牌蓝，浅色与深色背景都看得清；高光 #E8F2FF。
       想要原图那种深灰铃身，把第一条 path 的 fill 换成 #333333 即可。
       viewBox 按官方插件图标的留白对齐（官方两款同样画在 36x36 网格上，实测：「自动审查」
       内容占 52.7% x 66.6%、留白 23.6%/16.7%；「智能体团队」内容占 50% x 50%、留白 25%/24%）。
       本图铃铛本体实测 922 x 1025（比宽略高），取外框 1760 并居中 —— 内容占 52.4% x 58.2%，
       横向留白 23.8%（与官方一致）、纵向 20.9%（介于官方两款之间），缩到插件页的 30/36px
       观感与官方图标齐平；文件 <=256 KiB。 -->
